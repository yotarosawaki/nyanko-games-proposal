<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ご提案資料</title>
<style>
:root{--yellow:#ffe100;--ink:#141414;--paper:#fffdf5;--red:#d7262e;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:16px}
form{background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:28px 22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.tag{align-self:flex-start;background:var(--ink);color:var(--yellow);font-size:11px;font-weight:700;letter-spacing:.14em;padding:2px 10px}
h1{margin:0;font-size:22px;line-height:1.4}
p{margin:0;font-size:14px;line-height:1.7}
label{font-size:13px;font-weight:700}
input{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--ink);border-radius:0;width:100%;background:#fff;color:var(--ink)}
input:focus{outline:3px solid var(--yellow);outline-offset:1px}
button{font:inherit;font-size:16px;font-weight:700;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 20px;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
button:disabled{opacity:.6}
#msg{min-height:1.4em;color:var(--red);font-size:13px}
</style>
</head>

</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(DATA.iv)},key,u8(DATA.ct)));
  try{sessionStorage.setItem('kmg-pw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const b=document.getElementById('go'),m=document.getElementById('msg');
  b.disabled=true;m.textContent='';
  try{await unlock(document.getElementById('pw').value)}
  catch(err){m.textContent='パスワードがちがいます';b.disabled=false}
});
(async()=>{let pw=null;try{pw=sessionStorage.getItem('kmg-pw')}catch(e){}
  if(pw){try{await unlock(pw)}catch(e){try{sessionStorage.removeItem('kmg-pw')}catch(_){}}}})();
</script>
